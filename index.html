<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SIPEDA-WA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
  <h2>SIPEDA-WA</h2>
</div>

<div class="container">
  <p class="subtitle">Cek Keamanan Data WhatsApp Anda</p>

  <div class="card">
    <form>

      <label>🔐 Verifikasi dua langkah</label>
      <select id="verifikasi">
        <option value="2">Aktif</option>
        <option value="0">Tidak</option>
      </select>

      <label>⚠️ Klik link tidak dikenal</label>
      <select id="link">
        <option value="0">Sering</option>
        <option value="2">Tidak Pernah</option>
      </select>

      <label>📤 Berbagi data pribadi</label>
      <select id="data">
        <option value="0">Sering</option>
        <option value="1">Kadang</option>
        <option value="2">Tidak</option>
      </select>

      <label>🔒 Kunci aplikasi</label>
      <select id="kunci">
        <option value="2">Aktif</option>
        <option value="0">Tidak</option>
      </select>

      <button type="button" onclick="hitung()">Cek Sekarang</button>

    </form>
  </div>

  <div class="result-card" id="resultBox">
    <h2 id="hasil"></h2>
    <div class="progress">
      <div id="progressBar"></div>
    </div>
    <p id="rekomendasi"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
